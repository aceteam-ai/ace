name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  no-coauthor-trailers:
    name: No co-author trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check PR commits and squash message inputs
        run: node scripts/check-coauthor-trailers.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
        name: Type check

      - run: pnpm test
        name: Run tests

      - run: pnpm build
        name: Build

      - name: Smoke test built CLI startup
        run: |
          node dist/index.js --version
          node dist/index.js < /dev/null
